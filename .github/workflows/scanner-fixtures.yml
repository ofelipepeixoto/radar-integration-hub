name: Testar scanner com fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter código para testes sintéticos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Obter scanner fixado
        run: bash scripts/install_gitleaks.sh "${RUNNER_TEMP}/radar-gitleaks"
      - name: Testar controles sem credenciais ou provedores reais
        env:
          RADAR_GITLEAKS_BINARY: ${{ runner.temp }}/radar-gitleaks/gitleaks
        run: python3 -m unittest discover -s tests -p 'test_secrets.py' -v
