name: Nanobrowser patch reproduction
on:
  pull_request:
    paths: ['experiments/nanobrowser-patches/**', '.github/workflows/nanobrowser-patches.yml']
  push:
    branches: [main, codex/nanobrowser-patch-repro]
    paths: ['experiments/nanobrowser-patches/**', '.github/workflows/nanobrowser-patches.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: corepack enable
      - run: bash experiments/nanobrowser-patches/reproduce.sh
