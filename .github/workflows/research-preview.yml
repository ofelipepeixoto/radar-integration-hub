name: Pesquisa offline com evidências
on: [push, pull_request]
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ofelipepeixoto/radar-evidence-kit
          ref: 3008c8dbb3e950a7ba0c6794576880f91d85a65d
          path: .audit-deps/radar-evidence-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verificar consumidor Node e contratos Python reais
        env:
          RADAR_EVIDENCE_KIT_PATH: ${{ github.workspace }}/.audit-deps/radar-evidence-kit/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          npm run test:research
          npm run demo:research
